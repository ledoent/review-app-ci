name: Deploy environment (reusable)

# Staging/production promotion. Callers trigger staging on push to main and
# production on a v* tag (or manual dispatch), both behind a GitHub
# environment so protection rules and deployment history apply.
#
# This is also where GitHub secrets become cluster secrets: the APP_ENV JSON
# secret is materialized as <app>-secrets in the target namespace. Review
# environments then COPY named secrets from staging — one seeding point, one
# copying mechanism, no per-workflow --from-literal drift.

on:
  workflow_call:
    inputs:
      environment:
        description: "staging | production"
        type: string
        required: true
      app_name:
        type: string
        required: true
      image:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      migrator_image:
        type: string
        default: ""
      pull_secret_name:
        description: Dockerconfig secret refreshed from REGISTRY_PULL_TOKEN (must match the base Deployment's imagePullSecrets)
        type: string
        default: registry-pull
      cnpg_cluster_name:
        description: When set and <overlay>/cnpg-cluster.yaml exists, it is applied and awaited BEFORE the full overlay (first-bootstrap ordering)
        type: string
        default: ""
      overlay:
        description: Overlay path (defaults to deploy/overlays/<environment>)
        type: string
        default: ""
      namespace:
        description: Target namespace (defaults to <app>-<environment>)
        type: string
        default: ""
      deployment_name:
        type: string
        default: ""
      env_url:
        description: Public URL recorded on the GitHub environment
        type: string
        default: ""
      secret_name:
        description: Cluster secret materialized from APP_ENV (defaults to <app>-secrets)
        type: string
        default: ""
      cluster_auth:
        type: string
        default: kubeconfig
      wif_provider:
        type: string
        default: ""
      gcp_service_account:
        type: string
        default: ""
      gcp_project:
        type: string
        default: ""
      gke_cluster:
        type: string
        default: ""
      gke_zone:
        type: string
        default: ""
      runs_on:
        type: string
        default: ubuntu-latest
    secrets:
      KUBE_CONFIG:
        required: false
      APP_ENV:
        description: JSON object {"KEY":"value",...} -> cluster secret. Empty = leave existing secret alone.
        required: false
      REGISTRY_PULL_TOKEN:
        description: Refreshes the pull secret every deploy so token rotation cannot strand the namespace on a stale secret
        required: false

jobs:
  deploy:
    runs-on: ${{ inputs.runs_on }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.env_url }}
    concurrency:
      group: deploy-${{ inputs.app_name }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      NS: ${{ inputs.namespace || format('{0}-{1}', inputs.app_name, inputs.environment) }}
      OVERLAY: ${{ inputs.overlay || format('deploy/overlays/{0}', inputs.environment) }}
    steps:
      - name: Validate inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CLUSTER_AUTH: ${{ inputs.cluster_auth }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in staging|production) ;;
            *) echo "::error::environment must be staging or production, got '$ENVIRONMENT'"; exit 1 ;; esac
          case "$CLUSTER_AUTH" in kubeconfig|gke-wif) ;;
            *) echo "::error::unknown cluster_auth '$CLUSTER_AUTH'"; exit 1 ;; esac

      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Checkout review-app-ci
        uses: actions/checkout@v4
        with:
          repository: ledoent/review-app-ci
          ref: ${{ github.job_workflow_sha }}
          path: .review-ci

      - name: Setup deploy tools
        uses: ./.review-ci/actions/setup-deploy
        with:
          cluster-auth: ${{ inputs.cluster_auth }}
          kube-config: ${{ secrets.KUBE_CONFIG }}
          wif-provider: ${{ inputs.wif_provider }}
          gcp-service-account: ${{ inputs.gcp_service_account }}
          gcp-project: ${{ inputs.gcp_project }}
          gke-cluster: ${{ inputs.gke_cluster }}
          gke-zone: ${{ inputs.gke_zone }}

      # Always runs — the overlays don't carry a Namespace object, and a
      # first bootstrap without APP_ENV must not fail at apply with
      # "namespace not found".
      - name: Ensure namespace
        run: kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh registry pull secret
        env:
          REGISTRY_PULL_TOKEN: ${{ secrets.REGISTRY_PULL_TOKEN }}
          IMAGE: ${{ inputs.image }}
          PULL_SECRET: ${{ inputs.pull_secret_name }}
        run: |
          set -euo pipefail
          if [ -z "$REGISTRY_PULL_TOKEN" ]; then
            echo "no REGISTRY_PULL_TOKEN; leaving $PULL_SECRET untouched"
            exit 0
          fi
          REG_HOST="${IMAGE%%/*}"
          jq -n --arg ns "$NS" --arg name "$PULL_SECRET" --arg host "$REG_HOST" \
            '{apiVersion: "v1", kind: "Secret",
              metadata: {name: $name, namespace: $ns},
              type: "kubernetes.io/dockerconfigjson",
              stringData: {".dockerconfigjson":
                ({auths: {($host): {username: "x-access-token",
                                    password: env.REGISTRY_PULL_TOKEN,
                                    auth: ("x-access-token:" + env.REGISTRY_PULL_TOKEN | @base64)}}} | tojson)}}' \
            | kubectl apply -f - >/dev/null
          echo "pull secret $PULL_SECRET refreshed"

      - name: Materialize APP_ENV secret
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          SECRET_NAME: ${{ inputs.secret_name || format('{0}-secrets', inputs.app_name) }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ENV" ]; then
            echo "no APP_ENV secret passed; leaving $SECRET_NAME untouched"
            exit 0
          fi
          echo "$APP_ENV" | jq -e 'type == "object"' >/dev/null \
            || { echo "::error::APP_ENV is not a JSON object"; exit 1; }
          echo "$APP_ENV" | jq '{apiVersion: "v1", kind: "Secret",
            metadata: {name: env.SECRET_NAME, namespace: env.NS},
            type: "Opaque", stringData: .}' \
            | kubectl apply -f - >/dev/null
          echo "materialized $SECRET_NAME in $NS ($(echo "$APP_ENV" | jq 'keys | length') keys)"

      # First-bootstrap ordering: the CNPG cluster must be Ready before the
      # Deployment that mounts its -app secret, or pods loop in
      # CreateContainerConfigError.
      #
      # Wake before wait: a HIBERNATED cluster (cnpg.io/hibernation=on — the
      # scale-to-zero pattern staging environments use) still reports
      # "healthy", so the Ready wait passes while no database pod exists and
      # the app then hangs in its wait-for-db init forever. Observed live on
      # bimble staging.
      - name: CNPG cluster (phase 1)
        if: inputs.cnpg_cluster_name != ''
        env:
          CLUSTER_NAME: ${{ inputs.cnpg_cluster_name }}
        run: |
          set -euo pipefail
          if [ -f "$OVERLAY/cnpg-cluster.yaml" ]; then
            kubectl -n "$NS" apply -f "$OVERLAY/cnpg-cluster.yaml"
            hib=$(kubectl -n "$NS" get cluster "$CLUSTER_NAME" \
              -o jsonpath='{.metadata.annotations.cnpg\.io/hibernation}' 2>/dev/null || true)
            if [ "$hib" = "on" ]; then
              echo "cluster $CLUSTER_NAME is hibernated; waking"
              kubectl -n "$NS" annotate cluster "$CLUSTER_NAME" cnpg.io/hibernation=off --overwrite
            fi
            kubectl -n "$NS" wait --for=condition=Ready "cluster/$CLUSTER_NAME" --timeout=600s
            # Ready alone is not enough post-hibernation: require a running
            # instance before letting the app's rollout start its clock.
            kubectl -n "$NS" wait --for=jsonpath='{.status.readyInstances}'=1 \
              "cluster/$CLUSTER_NAME" --timeout=600s || true
          else
            echo "no $OVERLAY/cnpg-cluster.yaml; skipping"
          fi

      - name: Set image and apply
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.image_tag }}
          MIGRATOR: ${{ inputs.migrator_image }}
        run: |
          set -euo pipefail
          test -f "$OVERLAY/kustomization.yaml" || { echo "::error::$OVERLAY has no kustomization.yaml"; exit 1; }
          cd "$OVERLAY"
          kustomize edit set image "$IMAGE=$IMAGE:$TAG"
          [ -z "$MIGRATOR" ] || kustomize edit set image "$MIGRATOR=$MIGRATOR:$TAG"
          cd - >/dev/null
          kustomize build "$OVERLAY" | kubectl apply --server-side --force-conflicts -f -

      # Hard-fail. A `|| echo "migration skipped"` here once let production
      # deploy an unmigrated schema and report success. Full manifest, not
      # `kubectl create job`: the migrator needs the pull secret and the
      # app's secret env to reach its database.
      - name: Run migrations
        if: inputs.migrator_image != ''
        env:
          MIGRATOR: ${{ inputs.migrator_image }}
          TAG: ${{ inputs.image_tag }}
          PULL_SECRET: ${{ inputs.pull_secret_name }}
          SECRET_NAME: ${{ inputs.secret_name || format('{0}-secrets', inputs.app_name) }}
        run: |
          set -euo pipefail
          JOB="migrate-$(echo "$TAG" | tr -c 'a-z0-9-' '-' | cut -c1-40 | sed 's/-*$//')"
          kubectl -n "$NS" delete job "$JOB" --ignore-not-found --wait=true
          kubectl -n "$NS" apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $JOB
          spec:
            backoffLimit: 1
            template:
              spec:
                restartPolicy: Never
                imagePullSecrets:
                  - name: $PULL_SECRET
                containers:
                  - name: migrate
                    image: $MIGRATOR:$TAG
                    envFrom:
                      - secretRef:
                          name: $SECRET_NAME
                          optional: true
          EOF
          if ! kubectl -n "$NS" wait --for=condition=complete "job/$JOB" --timeout=300s; then
            echo "::error::migration job failed"
            kubectl -n "$NS" logs "job/$JOB" --tail=100 || true
            exit 1
          fi

      - name: Wait for rollout
        env:
          DEPLOY_NAME: ${{ inputs.deployment_name || inputs.app_name }}
        run: kubectl -n "$NS" rollout status "deploy/$DEPLOY_NAME" --timeout=300s

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== pods ==="; kubectl -n "$NS" get pods -o wide || true
          echo "=== events ==="; kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -40 || true
